name: Publish

on:
  push:
    branches:
      - fork

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: 23
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew publish
        env:
          GOOGLE_KEY: ${{ secrets.GOOGLE_KEY }}
